[workspace]
resolver = "2"
members = ["crates/near-drive-core", "crates/near-drive-client", "crates/near-drive-gateway", "crates/near-drive-s3", "crates/near-drive-ckd", "crates/near-drive-chain", "crates/near-drive-cli", "crates/near-drive-sync", "crates/near-drive-mount", "crates/near-drive-tray"]
# NEAR contracts target wasm and have their own workspace (contracts/Cargo.toml).
exclude = ["contracts"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
bs58 = "0.5"
base64 = "0.22"
hex = "0.4"
x25519-dalek = { version = "2", features = ["static_secrets"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync", "time", "net", "io-util"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
async-trait = "0.1"
bytes = "1"
futures-util = "0.3"
object_store = { version = "0.13", default-features = false, features = ["aws"] }
near-drive-core = { path = "crates/near-drive-core" }
near-drive-client = { path = "crates/near-drive-client" }
near-drive-gateway = { path = "crates/near-drive-gateway" }
near-drive-ckd = { path = "crates/near-drive-ckd" }
near-drive-s3 = { path = "crates/near-drive-s3" }
near-drive-chain = { path = "crates/near-drive-chain" }
near-drive-sync = { path = "crates/near-drive-sync" }
near-drive-mount = { path = "crates/near-drive-mount" }
