[package]
name = "nstorage-contract"
description = "storage.near: namespace policy, encryption keys, gateway registry, anchors and payment escrow for nstorage"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ilblackdragon/nstorage"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk.workspace = true
bs58 = { version = "0.5", default-features = false, features = ["alloc"] }

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }
near-workspaces = "0.23"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
anyhow = "1"
nstorage-near = { path = "../../crates/nstorage-near" }
nstorage-core = { path = "../../crates/nstorage-core" }
