[package]
name = "near-drive-contract"
description = "drive.near: namespace policy, encryption keys, gateway registry, anchors and payment escrow for NEAR Drive"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ilblackdragon/near-drive"

[lib]
crate-type = ["cdylib", "rlib"]

# Reproducible build: `cargo near build reproducible-wasm` runs the command
# below in this exact image (pinned by digest) on a clean, pushed commit, and
# records image, command and source commit in the wasm (NEP-330
# `contract_source_metadata`). See docs/contract.md.
[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.21.1-rust-1.96.0"
image_digest = "sha256:ccb22bb4e677ed022d8b9d1aa1b32f0af52dd0471ef1c32e48dedbf68ee6ee17"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]

[dependencies]
near-sdk.workspace = true
bs58 = { version = "0.5", default-features = false, features = ["alloc"] }

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }
near-workspaces = "0.23"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
anyhow = "1"
near-drive-chain = { path = "../../crates/near-drive-chain" }
near-drive-core = { path = "../../crates/near-drive-core" }
near-drive-client = { path = "../../crates/near-drive-client" }
near-drive-gateway = { path = "../../crates/near-drive-gateway" }
tempfile = "3"
ed25519-dalek = "2"
axum = "0.8"
