# NEAR contracts (wasm). Separate workspace from the root one: build with
#   cargo near build non-reproducible-wasm --manifest-path contracts/drive/Cargo.toml
[workspace]
resolver = "2"
members = ["drive", "mock-ft", "mock-mt"]

[workspace.dependencies]
near-sdk = "5.29"
near-contract-standards = "5.29"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
