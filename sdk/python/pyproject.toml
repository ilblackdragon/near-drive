[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nstorage"
version = "0.1.0"
description = "Python SDK for nstorage: NEAR-account-addressed, end-to-end-encrypted object storage"
readme = "README.md"
license = { text = "MIT OR Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["PyNaCl>=1.5", "blake3>=0.4", "base58>=2.1", "httpx>=0.27"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
nst-py = "nstorage.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
