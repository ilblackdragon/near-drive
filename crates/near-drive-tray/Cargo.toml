[package]
name = "near-drive-tray"
description = "NEAR Drive tray / menu-bar app: sync status, open folders, pause / resume"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true

# Linux: StatusNotifierItem over D-Bus (ksni), no GTK needed.
[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }

# Windows / macOS: native tray / menu bar, driven by a tao event loop.
[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = "0.26"
tao = "0.34"

[[bin]]
name = "near-drive-tray"
path = "src/main.rs"
