[package]
name = "near-drive-sync"
description = "NEAR Drive folder sync: a local folder kept in two-way sync with a NEAR Drive prefix (Linux, macOS, Windows)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures-util.workspace = true
blake3.workspace = true
tracing.workspace = true
near-drive-client.workspace = true
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
unicode-normalization = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
tempfile.workspace = true
near-drive-gateway.workspace = true
ed25519-dalek.workspace = true
rand.workspace = true
axum.workspace = true
