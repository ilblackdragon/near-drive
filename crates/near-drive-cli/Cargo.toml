[package]
name = "near-drive-cli"
description = "NEAR Drive CLI: standalone `near-drive` and the `near drive` extension for near-cli-rs"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std"] }
clap.workspace = true
near-drive-core.workspace = true
near-drive-client.workspace = true
near-drive-ckd.workspace = true
near-drive-chain.workspace = true
hex.workspace = true
ed25519-dalek.workspace = true
rand.workspace = true
near-drive-s3.workspace = true
tracing-subscriber.workspace = true
inquire = "0.9"
dirs = "5"
libc = "0.2"
toml = "0.8"
bs58.workspace = true
# Same backends as near-cli-rs, so `near` and `near-drive` share the OS keychain.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }

[[bin]]
name = "near-drive"
path = "src/main.rs"
