description = "S3-compatible local sidecar for NEAR Drive (SigV4 in, native signed+encrypted API out)"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
axum.workspace = true
tracing.workspace = true
hex.workspace = true
base64.workspace = true
sha2.workspace = true
rand.workspace = true
near-drive-client.workspace = true
bytes.workspace = true
futures-util.workspace = true
hmac = "0.12"
md-5 = "0.10"
sha1 = "0.10"
crc = "3.3"
