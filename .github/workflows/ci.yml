name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build CLI
        run: cargo build -p near-drive-cli
      - name: test (all crates)
        if: runner.os == 'Linux'
        run: cargo test --workspace --no-fail-fast
      - name: test (client, sync, gateway; macOS / Windows)
        if: runner.os != 'Linux'
        # The folder-sync, resilience and e2e suites run a real gateway in-process.
        run: >
          cargo test --no-fail-fast -p near-drive-core -p near-drive-client -p near-drive-sync -p near-drive-mount -p near-drive-cli
          && cargo test --no-fail-fast -p near-drive-gateway --lib --test e2e --test streaming --test resilience

  macos-file-provider:
    name: macOS File Provider extension (build)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: generate Xcode project
        run: brew install xcodegen && cd macos && xcodegen generate
      - name: build app + extension (unsigned)
        run: >
          cd macos && xcodebuild -project NEARDrive.xcodeproj -target NEARDrive -configuration Debug
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: check the extension is embedded
        run: |
          app=$(find macos/build -name "NEARDrive.app" -type d | head -1)
          test -f "$app/Contents/PlugIns/NEARDriveFileProvider.appex/Contents/Info.plist"
          plutil -p "$app/Contents/PlugIns/NEARDriveFileProvider.appex/Contents/Info.plist" | grep -q com.apple.fileprovider-nonui

  docker:
    name: server image (build + smoke)
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: near-drive:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: smoke
        run: |
          docker run --rm near-drive:ci near-drive-gateway --version
          docker run --rm near-drive:ci near-drive --version
          docker run -d --name gw -p 127.0.0.1:8787:8787 -e NEAR_DRIVE_CONFIG_JSON='{"listen":"0.0.0.0:8787","data_dir":"/data/gw"}' near-drive:ci
          for i in $(seq 30); do curl -sf http://127.0.0.1:8787/healthz && break; sleep 1; done
          curl -sf http://127.0.0.1:8787/healthz
